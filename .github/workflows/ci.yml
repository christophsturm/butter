name: CI

# Build + unit-test FFAI on Apple Silicon. Runs on:
#   - every push to `main` (release branch — gate before tagging)
#   - every push to `dev`  (working branch — catch regressions early)
#   - every PR targeting either branch
#
# Scope is intentionally limited to the **unit suite** (FFAITests +
# IronSwiftTests). The integration suite (ModelTests) downloads
# multi-GB HuggingFace snapshots + does real end-to-end inference —
# too slow for every PR, and OOM-prone on the runner's 7 GB cap.
# The release workflow exercises the integration suite right before
# tagging — see .github/workflows/release.yml — so if a dev change
# breaks a model we catch it at the release boundary, not on each PR.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  # Don't cancel in-progress runs on protected branches (main, dev) so
  # the green-build history stays intact; do cancel earlier runs on the
  # same feature branch as a contributor pushes new commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  build_and_test:
    if: github.repository_owner == 'thewafflehaus'
    name: Build and test (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FFAI

    steps:
      - name: Checkout FFAI
        uses: actions/checkout@v6
        with:
          path: FFAI

      - name: Checkout sibling iron
        # Pinned to `dev` for now because:
        #   - thewafflehaus/iron main is behind upstream's CLI rework.
        #   - upstream/iron main is a `gm` placeholder commit.
        #   - All the kernels FFAI's Ops.swift expects live on
        #     thewafflehaus/iron dev (post the ek/std-kernels merge).
        # Move back to `main` once we sync our org's main from upstream's
        # post-CLI-rework main, or cut a iron release tag and pin to it.
        uses: actions/checkout@v6
        with:
          repository: thewafflehaus/iron
          ref: dev
          path: iron

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry + iron build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/iron/target
          key: cargo-${{ runner.os }}-${{ hashFiles('iron/Cargo.lock', 'iron/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          path: |
            FFAI/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('FFAI/Package.swift', 'FFAI/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Generate kernel artifacts (iron build --emit all)
        # Compiles iron and produces kernels.metallib + manifest.json
        # + Generated/IronKernels.swift into FFAI/Sources/IronSwift/.
        # Once the `iron` binary ships via Homebrew this no longer needs
        # the sibling iron checkout. Run from iron/ so its
        # rust-toolchain.toml (nightly, 2024 edition) is picked up.
        working-directory: iron
        # `iron build` spawns `__iron_runner` (wh-iron-std bin) for
        # kernel discovery, resolved by bare name via PATH. Build both and
        # put target/release on PATH — building only `iron` never builds
        # the sibling runner.
        run: |
          cargo build --release --bin iron --bin __iron_runner
          PATH="$PWD/target/release:$PATH" iron build --emit all \
            --out ${{ github.workspace }}/FFAI/Sources/IronSwift
          # The emitter does not prepend `// swift-format-ignore-file`;
          # add it so the lint pass skips the generated wrappers.
          OUT="${{ github.workspace }}/FFAI/Sources/IronSwift/Generated"
          if [ -f "$OUT/IronKernels.swift" ] && ! head -1 "$OUT/IronKernels.swift" | grep -q swift-format-ignore-file; then
            tmp="$OUT/IronKernels.swift.tmp"
            { printf '// swift-format-ignore-file\n//\n'; cat "$OUT/IronKernels.swift"; } > "$tmp"
            mv "$tmp" "$OUT/IronKernels.swift"
          fi

      - name: Run unit tests (with coverage)
        # FFAITests + IronSwiftTests (kernel round-trip).
        # Integration tests (ModelTests) are deliberately excluded — they
        # ship a different way (release.yml runs them right before tagging).
        #
        # One swift test invocation handles compile + coverage
        # instrumentation + run in a single pass. A separate `swift build`
        # step is intentionally NOT used here: --enable-code-coverage
        # needs -profile-generate / -profile-coverage-mapping to be on at
        # compile time, which --skip-build cannot apply retroactively. The
        # symptom is tests pass but the run exits 1 with "The folder
        # 'codecov' doesn't exist". Letting swift test own the build keeps
        # the coverage and testability flags in lockstep.
        run: swift test --enable-code-coverage --filter "FFAITests|IronSwiftTests"

      - name: Coverage summary
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROF_DATA="$BIN_PATH/codecov/default.profdata"
          if [ -f "$PROF_DATA" ]; then
            xcrun llvm-cov report \
              "$BIN_PATH/FFAIPackageTests.xctest/Contents/MacOS/FFAIPackageTests" \
              -instr-profile="$PROF_DATA" \
              -ignore-filename-regex='(\.build|Tests|Generated)' || true
          else
            echo "No coverage data produced (no tests ran?)"
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            FFAI/.build/**/Logs/Test/*.xcresult
          retention-days: 7
