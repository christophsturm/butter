[package]
name = "wh-butter-cuda"
description = "Butter CUDA backend — wraps wh-iron-runtime's CudaDevice (NVRTC -> PTX -> driver) behind the wh-butter-core Device trait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wh-butter-core.workspace = true
wh-iron-core.workspace = true
wh-iron-codegen = { workspace = true, optional = true }
wh-iron-runtime = { workspace = true, optional = true }

[dev-dependencies]
wh-butter-modeltests.workspace = true
wh-butter-core.workspace = true
wh-butter-ops.workspace = true
wh-butter-models.workspace = true
wh-butter-loader.workspace = true
wh-iron-core.workspace = true

[features]
# Off by default so macOS / non-CUDA hosts build the crate as a stub.
# `--features cuda` pulls wh-iron-runtime's real CUDA device.
cuda = ["dep:wh-iron-runtime", "dep:wh-iron-codegen", "wh-iron-runtime/cuda"]

