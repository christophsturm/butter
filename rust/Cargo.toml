[workspace]
resolver = "2"
members = [
    "crates/ffai-core",
    "crates/ffai-ops",
    "crates/ffai-loader",
    "crates/ffai-runtime",
    "crates/ffai-models",
    "crates/ffai-modeltests",
    "crates/ffai",
    "crates/ffai-cli",
    "crates/ffai-ffi",
    "crates/backends/ffai-metal",
    "crates/backends/ffai-cuda",
    "crates/backends/ffai-vulkan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Eric Kryski (@ekryski)", "Tom Turney (@TheTom)"]
repository = "https://github.com/thewafflehaus/FFAI"

[workspace.dependencies]
# ── engine crates ────────────────────────────────────────────────────
ffai-core = { path = "crates/ffai-core" }
ffai-ops = { path = "crates/ffai-ops" }
ffai-loader = { path = "crates/ffai-loader" }
ffai-runtime = { path = "crates/ffai-runtime" }
ffai-models = { path = "crates/ffai-models" }
ffai = { path = "crates/ffai" }
ffai-modeltests = { path = "crates/ffai-modeltests" }
# ── backend crates ───────────────────────────────────────────────────
ffai-metal = { path = "crates/backends/ffai-metal" }
ffai-cuda = { path = "crates/backends/ffai-cuda" }
ffai-vulkan = { path = "crates/backends/ffai-vulkan" }
# ── shared kernel toolchain (external: the ffai-kernels cuda/metal repo) ──
# Canonical pointer is the org `dev` branch, so a fresh clone is
# self-contained. For local co-development against a sibling ffai-kernels
# checkout, add a `[patch]` override in your own (uncommitted) config.
ffai-kernels-core = { git = "https://github.com/thewafflehaus/ffai-kernels", branch = "dev" }
ffai-kernels-codegen = { git = "https://github.com/thewafflehaus/ffai-kernels", branch = "dev" }
ffai-kernels-runtime = { git = "https://github.com/thewafflehaus/ffai-kernels", branch = "dev" }
ffai-kernels-std = { git = "https://github.com/thewafflehaus/ffai-kernels", branch = "dev" }
# ── third-party ──────────────────────────────────────────────────────
thiserror = "2"
serde_json = "1"
memmap2 = "0.9"
parking_lot = "0.12"   # faster, unpoisoned locks on the dispatch hot path
rustc-hash = "2"       # FxHash for already-hashed / densely-numeric keys


# Perf build for benchmarks (fat-LTO inlines parking_lot locks, Arc/Rc clones,
# FNV/Fx hash closures into the hot path). Kept OUT of [profile.release] on
# purpose: fat-LTO + codegen-units=1 balloons build time with the ffai-kernels
# patch, and `panic="abort"` would break `cargo test`. (Rust-playbook split.)
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
