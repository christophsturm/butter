[workspace]
resolver = "2"
members = [
    "crates/ffai-core",
    "crates/ffai-ops",
    "crates/ffai-loader",
    "crates/ffai-runtime",
    "crates/ffai-models",
    "crates/ffai-modeltests",
    "crates/ffai",
    "crates/ffai-cli",
    "crates/ffai-ffi",
    "crates/backends/ffai-metal",
    "crates/backends/ffai-cuda",
    "crates/backends/ffai-vulkan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Eric Kryski (@ekryski)", "Tom Turney (@TheTom)"]
repository = "https://github.com/TheTom/ffai"

[workspace.dependencies]
rayon = "1"
# ── engine crates ────────────────────────────────────────────────────
ffai-core = { path = "crates/ffai-core" }
ffai-ops = { path = "crates/ffai-ops" }
ffai-loader = { path = "crates/ffai-loader" }
ffai-runtime = { path = "crates/ffai-runtime" }
ffai-models = { path = "crates/ffai-models" }
ffai = { path = "crates/ffai" }
ffai-modeltests = { path = "crates/ffai-modeltests" }
# ── backend crates ───────────────────────────────────────────────────
ffai-metal = { path = "crates/backends/ffai-metal" }
ffai-cuda = { path = "crates/backends/ffai-cuda" }
ffai-vulkan = { path = "crates/backends/ffai-vulkan" }
# ── shared kernel toolchain (external: the metaltile cuda/metal repo) ──
# Canonical pointer is the upstream perf branch (split backend PRs #273/#274
# + conv consolidation), so a fresh clone (Eric included) is self-contained. Local co-development overrides
# these to the live checkout via the [patch] section below.
metaltile-core = { git = "https://github.com/0xClandestine/metaltile", branch = "tom/perf/cuda-prefill-fp4-moe" }
metaltile-codegen = { git = "https://github.com/0xClandestine/metaltile", branch = "tom/perf/cuda-prefill-fp4-moe" }
metaltile-runtime = { git = "https://github.com/0xClandestine/metaltile", branch = "tom/perf/cuda-prefill-fp4-moe" }
metaltile-std = { git = "https://github.com/0xClandestine/metaltile", branch = "tom/perf/cuda-prefill-fp4-moe" }
# ── third-party ──────────────────────────────────────────────────────
thiserror = "2"
serde_json = "1"
memmap2 = "0.9"
parking_lot = "0.12"   # faster, unpoisoned locks on the dispatch hot path
rustc-hash = "2"       # FxHash for already-hashed / densely-numeric keys

# Local co-dev override: when the metaltile checkout sits beside this repo
# (../metaltile-cuda), build against it directly — instant, no fetch, edits
# to kernels/codegen pick up immediately. Eric / CI without that sibling
# fall through to the git branch above. Comment out to force the git dep.
[patch."https://github.com/0xClandestine/metaltile"]
metaltile-core = { path = "../../metaltile-cuda/crates/metaltile-core" }
metaltile-codegen = { path = "../../metaltile-cuda/crates/metaltile-codegen" }
metaltile-runtime = { path = "../../metaltile-cuda/crates/metaltile-runtime" }
metaltile-std = { path = "../../metaltile-cuda/crates/metaltile-std" }

# Perf build for benchmarks (fat-LTO inlines parking_lot locks, Arc/Rc clones,
# FNV/Fx hash closures into the hot path). Kept OUT of [profile.release] on
# purpose: fat-LTO + codegen-units=1 balloons build time with the metaltile
# patch, and `panic="abort"` would break `cargo test`. (Rust-playbook split.)
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
